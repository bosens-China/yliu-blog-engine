name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json

  update-major-tag:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要获取所有历史记录来查找 tag
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update major version tag (e.g., v1, v2)
        run: |
          # release-please 的输出可能是 "root-v1.2.3"，我们的目标是提取 "v1"
          # 1. 从 "root-v1.2.3" 中提取版本部分 "v1.2.3"
          VERSION_PART=$(echo "${{ needs.release-please.outputs.tag_name }}" | sed -n 's/.*-\(v[0-9].*\)/\1/p')
          # 如果没有找到前缀，则直接使用原始标签名
          if [ -z "$VERSION_PART" ]; then
            VERSION_PART="${{ needs.release-please.outputs.tag_name }}"
          fi
          # 2. 从 "v1.2.3" 中提取主版本 "v1"
          MAJOR_VERSION_TAG=$(echo "$VERSION_PART" | cut -d'.' -f1)

          echo "The full tag is ${{ needs.release-please.outputs.tag_name }}"
          echo "The derived version part is $VERSION_PART"
          echo "The major version tag is $MAJOR_VERSION_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 创建或移动主版本标签 (例如 v1, v2)
          git tag -f "$MAJOR_VERSION_TAG" "${{ needs.release-please.outputs.tag_name }}"

          # 将标签强制推送到远程
          git push -f origin "$MAJOR_VERSION_TAG"
