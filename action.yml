name: 'YLiu Blog Engine'
description: '基于 GitHub Issues 的现代博客解决方案，追求零配置和最大化自动推导。'
author: 'Young Liu'

branding:
  icon: 'book-open'
  color: 'blue'

#================================================================================#
# 输入参数
#================================================================================#
inputs:
  # --- 基础与必需 ---
  GITHUB_TOKEN:
    description: 'GitHub Token，用于读取 Issues。请传入 `secrets.GITHUB_TOKEN`。'
    required: false
  NEXT_PUBLIC_GITHUB_REPOSITORY:
    description: '内容仓库地址，格式：owner/repo。默认为当前触发工作流的仓库。'
    required: false
    default: ${{ github.repository }}

  # --- AI 和专栏处理 ---
  OPENAI_API_KEY:
    description: '用于 AI 增强功能的 API Key (兼容 OpenAI 规范)。提供此密钥将自动启用 AI 功能。请传入 secrets.OPENAI_API_KEY。'
    required: false
  OPENAI_MODEL_NAME:
    description: '指定 AI 服务使用的 LLM 模型名称。'
    required: false
  OPENAI_BASE_URL:
    description: '指定 LLM API 的基地址。'
    required: false
  LLM_RPM_LIMIT:
    description: '设置对 LLM API 的每分钟请求数（RPM）限制。设置为 0 表示不限制。'
    required: false

  # --- 站点信息 ---
  NEXT_PUBLIC_BLOG_TITLE:
    description: '博客标题。'
    required: false
  NEXT_PUBLIC_BLOG_AUTHOR:
    description: '作者名称。'
    required: false
  NEXT_PUBLIC_FOOTER_TEXT:
    description: '页脚文本。'
    required: false
  NEXT_PUBLIC_HEADER_CONFIG:
    description: 'Header 菜单配置（JSON 字符串）。'
    required: false

  # --- 路由与 SEO ---
  NEXT_PUBLIC_BASE_PATH:
    description: '站点基础路径 (例如 /blog)。若不提供，将根据仓库名自动判断。'
    required: false
  NEXT_PUBLIC_SITE_URL:
    description: '站点的完整 URL。若不提供，将根据仓库名和GitHub Pages域名自动生成。'
    required: false
  NEXT_PUBLIC_SEO_DESCRIPTION:
    description: '用于 SEO 的站点描述。'
    required: false
  NEXT_PUBLIC_SEO_KEYWORDS:
    description: '用于 SEO 的站点关键词，用逗号分隔。'
    required: false

  # --- 内容处理 ---
  COLUMN_DELIMITERS:
    description: '专栏识别分隔符 (逗号分隔)'
    required: false
  COLUMN_MIN_ARTICLES:
    description: '专栏最少文章数'
    required: false
  COLUMN_MIN_PREFIX_LENGTH:
    description: '专栏识别最短公共前缀'
    required: false

#================================================================================#
# 输出参数
#================================================================================#
outputs:
  page_url:
    description: '部署后的网站 URL'
    value: ${{ steps.deployment.outputs.page_url }}

#================================================================================#
# 执行步骤
#================================================================================#
runs:
  using: 'composite'
  steps:
    - name: 检出用户仓库
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.NEXT_PUBLIC_GITHUB_REPOSITORY }}
        path: user_repo

    - name: 检出 Action 仓库
      uses: actions/checkout@v4
      with:
        repository: 'bosens-China/yliu-blog-engine'
        path: blog_engine

    - name: 安装 pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: 安装 Node.js 并缓存依赖
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: blog_engine/pnpm-lock.yaml

    - name: 安装依赖
      shell: bash
      working-directory: ./blog_engine
      run: pnpm install --frozen-lockfile

    - name: 恢复 Scripts 包缓存
      uses: actions/cache@v4
      with:
        path: ./blog_engine/packages/scripts/src/data/local-cache.json
        key: scripts-cache-${{ github.repository }}-${{ hashFiles('**/package-lock.json', '**/pnpm-lock.yaml') }}
        restore-keys: |
          scripts-cache-${{ github.repository }}-
          scripts-cache-

    - name: 设置 Python 环境 (仅在启用 AI 时)
      if: ${{ inputs.OPENAI_API_KEY != '' }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 恢复 AI 缓存
      if: ${{ inputs.OPENAI_API_KEY != '' }}
      uses: actions/cache@v4
      with:
        path: ./blog_engine/apps/agent_blog/agent_blog_cache.json
        key: agent-blog-cache-${{ github.repository }}-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          agent-blog-cache-${{ github.repository }}-
          agent-blog-cache-

    - name: 安装 uv 并启动 AI 服务
      if: ${{ inputs.OPENAI_API_KEY != '' }}
      shell: bash
      working-directory: ./blog_engine/apps/agent_blog
      env:
        OPENAI_API_KEY: ${{ inputs.OPENAI_API_KEY }}
        OPENAI_MODEL_NAME: ${{ inputs.OPENAI_MODEL_NAME }}
        OPENAI_BASE_URL: ${{ inputs.OPENAI_BASE_URL }}
        LLM_RPM_LIMIT: ${{ inputs.LLM_RPM_LIMIT }}
      run: |
        echo "🔧 安装 uv 包管理器..."
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.cargo/bin:$PATH"

        echo "📦 安装 agent_blog 依赖..."
        uv sync

        if [ -f "agent_blog_cache.json" ]; then
          echo "💾 发现已有 AI 缓存文件"
        else
          echo "📝 首次运行，将创建新的缓存文件"
        fi

        echo "🚀 启动 agent_blog 服务..."
        cat << EOF > .env
        OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}
        OPENAI_MODEL_NAME=${{ env.OPENAI_MODEL_NAME }}
        OPENAI_BASE_URL=${{ env.OPENAI_BASE_URL }}
        LLM_RPM_LIMIT=${{ env.LLM_RPM_LIMIT }}
        LLM_BURST_LIMIT=${{ env.LLM_BURST_LIMIT }}
        EOF

        nohup uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 > agent_blog.log 2>&1 &
        echo $! > agent_blog.pid

        echo "⏳ 等待 agent_blog 服务启动..."
        for i in {1..30}; do
          if curl -s -f http://localhost:8000/ > /dev/null; then
            echo "✅ agent_blog 服务已启动"
            break
          fi
          echo "等待中... ($i/30)"
          sleep 2
        done

        if ! curl -s -f http://localhost:8000/ > /dev/null; then
          echo "❌ agent_blog 服务启动失败，查看日志："
          cat agent_blog.log
          exit 1
        fi

        echo "⏳ 等待 AI 服务完全初始化..."
        sleep 5

    - name: 准备用户资源（如 about.md）
      shell: bash
      working-directory: ./blog_engine
      run: |
        ABOUT_PATH_SOURCE="../user_repo/about.md"
        ABOUT_PATH_DEST="about.md"
        if [ -f "$ABOUT_PATH_SOURCE" ]; then
          echo "发现 about.md，复制到 $ABOUT_PATH_DEST..."
          cp "$ABOUT_PATH_SOURCE" "$ABOUT_PATH_DEST"
        else
          echo "用户仓库未发现自定义 about.md，跳过。"
        fi

    - name: 准备环境变量与自动配置
      id: prep-env
      shell: bash
      run: |
        echo "开始自动配置..."
        REPO_OWNER=$(echo "${{ inputs.NEXT_PUBLIC_GITHUB_REPOSITORY }}" | cut -d'/' -f1)
        REPO_NAME=$(echo "${{ inputs.NEXT_PUBLIC_GITHUB_REPOSITORY }}" | cut -d'/' -f2)

        if [[ "$REPO_NAME" == "$REPO_OWNER.github.io" ]]; then
          DERIVED_BASE_PATH=""
        else
          DERIVED_BASE_PATH="/$REPO_NAME"
        fi

        DERIVED_SITE_URL="https://$(echo $REPO_OWNER | tr '[:upper:]' '[:lower:]').github.io$DERIVED_BASE_PATH"

        if [[ -z "${{ inputs.NEXT_PUBLIC_BASE_PATH }}" ]]; then
          FINAL_BASE_PATH="$DERIVED_BASE_PATH"
        else
          FINAL_BASE_PATH="${{ inputs.NEXT_PUBLIC_BASE_PATH }}"
        fi

        if [[ -z "${{ inputs.NEXT_PUBLIC_SITE_URL }}" ]]; then
          FINAL_SITE_URL="$DERIVED_SITE_URL"
        else
          FINAL_SITE_URL="${{ inputs.NEXT_PUBLIC_SITE_URL }}"
        fi

        echo "为 web build 步骤导出环境变量..."
        echo "NEXT_PUBLIC_GITHUB_REPOSITORY=${{ inputs.NEXT_PUBLIC_GITHUB_REPOSITORY }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_BLOG_TITLE=${{ inputs.NEXT_PUBLIC_BLOG_TITLE }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_BLOG_AUTHOR=${{ inputs.NEXT_PUBLIC_BLOG_AUTHOR }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SEO_DESCRIPTION=${{ inputs.NEXT_PUBLIC_SEO_DESCRIPTION }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SEO_KEYWORDS=${{ inputs.NEXT_PUBLIC_SEO_KEYWORDS }}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_BASE_PATH=${FINAL_BASE_PATH}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SITE_URL=${FINAL_SITE_URL}" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_FOOTER_TEXT<<EOF" >> $GITHUB_ENV
        echo "${{ inputs.NEXT_PUBLIC_FOOTER_TEXT }}" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_HEADER_CONFIG<<EOF" >> $GITHUB_ENV
        echo "${{ inputs.NEXT_PUBLIC_HEADER_CONFIG }}" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

        ENV_FILE="./blog_engine/packages/scripts/.env"
        echo "正在创建 .env 文件于 $ENV_FILE"

        # 检测 AI 是否启用
        if [[ -n "${{ inputs.OPENAI_API_KEY }}" ]]; then
          AI_ENABLED_VALUE="true"
          echo "检测到 OPENAI_API_KEY，启用 AI 功能"
        else
          AI_ENABLED_VALUE="false"
          echo "未检测到 OPENAI_API_KEY，禁用 AI 功能"
        fi

        cat << EOF > $ENV_FILE
        # 由 yliu-blog-engine action 自动生成
        GITHUB_TOKEN="${{ inputs.GITHUB_TOKEN }}"
        NEXT_PUBLIC_GITHUB_REPOSITORY="${{ inputs.NEXT_PUBLIC_GITHUB_REPOSITORY }}"
        NEXT_PUBLIC_BLOG_TITLE="${{ inputs.NEXT_PUBLIC_BLOG_TITLE }}"
        NEXT_PUBLIC_BLOG_AUTHOR="${{ inputs.NEXT_PUBLIC_BLOG_AUTHOR }}"
        NEXT_PUBLIC_FOOTER_TEXT="${{ inputs.NEXT_PUBLIC_FOOTER_TEXT }}"
        NEXT_PUBLIC_HEADER_CONFIG='${{ inputs.NEXT_PUBLIC_HEADER_CONFIG }}'
        NEXT_PUBLIC_SEO_DESCRIPTION="${{ inputs.NEXT_PUBLIC_SEO_DESCRIPTION }}"
        NEXT_PUBLIC_SEO_KEYWORDS="${{ inputs.NEXT_PUBLIC_SEO_KEYWORDS }}"
        AI_ENABLED=$AI_ENABLED_VALUE
        COLUMN_DELIMITERS="${{ inputs.COLUMN_DELIMITERS }}"
        COLUMN_MIN_ARTICLES=${{ inputs.COLUMN_MIN_ARTICLES }}
        COLUMN_MIN_PREFIX_LENGTH=${{ inputs.COLUMN_MIN_PREFIX_LENGTH }}
        NEXT_PUBLIC_BASE_PATH="$FINAL_BASE_PATH"
        NEXT_PUBLIC_SITE_URL="$FINAL_SITE_URL"
        EOF

        echo "--- 最终 .env 内容 ---"
        cat $ENV_FILE
        echo "--------------------------"

    - name: 拉取数据与资源
      shell: bash
      working-directory: ./blog_engine
      run: pnpm --filter @yliu/scripts build:data

    - name: 显示 AI 服务日志 (用于调试)
      if: always() && inputs.OPENAI_API_KEY != ''
      shell: bash
      working-directory: ./blog_engine/apps/agent_blog
      run: |
        echo "--- agent_blog.log ---"
        cat agent_blog.log
        echo "----------------------"

    - name: 清理 agent_blog 服务 (数据处理完成后)
      if: always() && inputs.OPENAI_API_KEY != ''
      shell: bash
      working-directory: ./blog_engine/apps/agent_blog
      run: |
        if [ -f agent_blog.pid ]; then
          PID=$(cat agent_blog.pid)
          if kill -0 $PID 2>/dev/null; then
            echo "🛑 AI 处理完成，停止 agent_blog 服务 (PID: $PID)"
            kill $PID
            for i in {1..10}; do
              if ! kill -0 $PID 2>/dev/null; then
                echo "✅ agent_blog 服务已停止"
                break
              fi
              sleep 1
            done
            if kill -0 $PID 2>/dev/null; then
              echo "🔥 强制终止 agent_blog 服务"
              kill -9 $PID
            fi
          fi
          rm -f agent_blog.pid
        fi

        if [ -f "agent_blog_cache.json" ]; then
          echo "💾 AI 缓存文件已更新，将在下次构建时复用"
          wc -l agent_blog_cache.json | awk '{print "缓存文件包含", $1, "行数据"}'
        fi

        rm -f .env agent_blog.log
        echo "🧹 AI 服务清理完成"

    - name: 构建前端应用
      shell: bash
      working-directory: ./blog_engine
      run: pnpm --filter @yliu/web build

    - name: 配置 GitHub Pages
      uses: actions/configure-pages@v5

    - name: 上传 Pages 构建产物
      uses: actions/upload-pages-artifact@v3
      with:
        path: './blog_engine/apps/web/out'

    - name: 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4